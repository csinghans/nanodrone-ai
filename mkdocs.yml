# MkDocs Material + i18n config for the bilingual docs site.
# Build/preview locally:  mkdocs serve
# The docs are deployed to GitHub Pages by .github/workflows/docs.yml.
site_name: nanodrone-ai
site_description: A beginner's step-by-step course on on-device AI autonomy for nano-drones
repo_url: https://github.com/csinghans/nanodrone-ai
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh-TW
          name: 繁體中文

# Paths are relative to each language folder (docs/en, docs/zh-TW).
nav:
  - Home: index.md
  - Overview: 00-overview.md
