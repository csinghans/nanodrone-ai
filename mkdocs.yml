# MkDocs Material + i18n config for the bilingual docs site.
# Build/preview locally:  mkdocs serve
# The docs are deployed to GitHub Pages by .github/workflows/docs.yml.
site_name: nanodrone-ai
site_description: A beginner's step-by-step course on on-device AI autonomy for nano-drones
# site_url MUST include the /nanodrone-ai/ subpath: GitHub Pages serves this
# project site from a subdirectory, and the language switcher builds its links
# relative to site_url. Without the subpath, "switch language" jumps to the
# domain root and 404s.
site_url: https://csinghans.github.io/nanodrone-ai/
repo_url: https://github.com/csinghans/nanodrone-ai
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh-TW
          name: 繁體中文

# Paths are relative to each language folder (docs/en, docs/zh-TW).
nav:
  - Home: index.md
  - "Start here": START-HERE.md
  - Overview: 00-overview.md
  - Glossary: GLOSSARY.md
  - "Lesson 1 — Flight control": 01-hover.md
  - "Lesson 2 — Perception": 02-perception.md
  - "Lesson 3 — Autonomy AI": 03-autonomy-ai.md
  - "Lesson 4 — Hardware": 04-hardware-gap8.md
  - "Lesson 5 (bonus) — Teleop": 05-teleop.md
  - "Lesson 6 — Follow-me": 06-follow-me.md
  - "Lesson 7 — Follow the pilot": 07-follow-person.md
  - "Lesson 8 — Follow a real person (CNN)": 08-follow-real.md
  - "Lesson 9 — Voice control": 09-voice.md
  - "Lesson 10 — Train your voice": 10-voice-train.md
  - "Roadmap — beyond Lesson 10": ROADMAP.md
  - "Lesson 11 — Mission state machine": 11-mission.md
  - "Lesson 12 — Voice-driven missions": 12-voice-mission.md
  - "Lesson 13 — Find / follow / land": 13-find-follow-land.md
  - "Lesson 14a — Mapping & patrol": 14a-map-patrol.md
  - "Lesson 14b — On-board budget": 14b-onboard-budget.md
  - "Lesson 16 — Graduation project": 16-capstone.md
  - "Lesson 17 — Monocular depth": 17-depth.md
  - "Lesson 18 — Optical flow / VO": 18-flow.md
  - "Lesson 19 — Multi-obstacle RL": 19-multi-avoid.md
  - "Lesson 20 — Domain randomization": 20-domain-rand.md
  - "Lesson 21 — Distillation": 21-distill.md
  - "Lesson 22 — Unified policy": 22-unified.md
