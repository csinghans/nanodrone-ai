name: CI

# Manual trigger only: run from the Actions tab ("Run workflow") or via
#   gh workflow run ci.yml
on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Python (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  smoke:
    name: Lesson smoke test (headless sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulation deps
        # On Linux, pybullet has a prebuilt wheel (no compile). Lessons 1-2 only
        # need the simulator + OpenCV -- no torch / stable-baselines3.
        run: |
          # setuptools<81 still ships pkg_resources, which gym-pybullet-drones imports.
          pip install "setuptools<81" numpy pybullet "gymnasium>=0.29" opencv-python-headless \
            transforms3d pillow matplotlib scipy "control>=0.10.2,<0.11"
          pip install --no-deps \
            "gym-pybullet-drones @ git+https://github.com/utiasDSL/gym-pybullet-drones.git"
      - name: Lesson 1 — hover (headless)
        run: python lessons/01_hover/hover_demo.py --headless
      - name: Lesson 2 — perception (headless)
        run: python lessons/02_perception/perception_demo.py --headless
      - name: Lesson 5 — teleop flight loop (selftest, no pad/GUI)
        run: python lessons/05_teleop/teleop_xbox.py --input selftest
      - name: Lesson 6 — follow-me (headless)
        run: python lessons/06_follow_me/follow_me.py --headless
      - name: Lesson 7 — follow the pilot (headless)
        run: python lessons/07_follow_person/follow_person.py --headless

  docs-parity:
    name: Bilingual docs parity (en <-> zh-TW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every docs/en/*.md must have a docs/zh-TW/*.md twin
        run: |
          missing=0
          for f in docs/en/*.md; do
            base="$(basename "$f")"
            if [ ! -f "docs/zh-TW/$base" ]; then
              echo "::error::Missing translation: docs/zh-TW/$base"
              missing=1
            fi
          done
          for f in docs/zh-TW/*.md; do
            base="$(basename "$f")"
            if [ ! -f "docs/en/$base" ]; then
              echo "::error::Orphan translation (no English source): docs/en/$base"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Bilingual parity check failed."
            exit 1
          fi
          echo "All docs are paired. ✅"
